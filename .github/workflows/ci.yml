name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: zig fmt --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Verify formatting
        run: zig fmt --check src/ build.zig

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build
      - name: Run tests
        run: zig build test

  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    needs: fmt
    defaults:
      run:
        working-directory: glu/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Lint
        run: |
          pipx install ruff
          ruff check glupy tests
          ruff format --check glupy tests
      - name: Typecheck
        run: |
          pip install mypy
          mypy
      - name: Install package (editable)
        run: pip install -e . pytest
      - name: Unit tests (no native library required)
        run: pytest -m "not integration" -q
      - name: Build libglu.so and run integration tests
        run: |
          zig build
          pytest -m integration -q
