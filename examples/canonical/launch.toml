# glu launch configuration for the "robot control room" showcase
#
# Run with:   glu launch -f examples/canonical/launch.toml
#
# Launch order matters: consumers start before producers so every shared
# memory segment is attached before the first message is written.
#
# Topics:
#   /robot/joint_states  — raw joint telemetry   (sensor_arm → 100 Hz, reliable)
#   /robot/health        — battery/health        (sensor_arm →   1 Hz, reliable)
#   /robot/fused         — fused control state   (coordinator → reliable)
#   /robot/command       — operator commands     (operator   → reliable)
#   /robot/logs          — best-effort log feed  (coordinator → best_effort)

[[node]]
name = "operator"
bin  = "zig-out/bin/glu-operator"

[[node]]
name = "logger"
bin  = "zig-out/bin/glu-logger"

[[node]]
name = "coordinator"
bin  = "zig-out/bin/glu-coordinator"

[[node]]
name = "sensor_arm"
bin  = "zig-out/bin/glu-sensor-arm"
